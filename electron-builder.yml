{
  '$schema': 'https://go.quicktype.io/electron-builder/26.15.3/schema.json',
  'appId': 'com.hlsitechio.electron-shell-framework',
  'productName': 'App Shell',
  'copyright': 'Copyright © 2026 hlsitechio',

  'directories': { 'output': 'release/${version}', 'buildResources': 'build' },

  'files': ['out/**/*', 'package.json', 'build/icon.png', '!**/*.map', '!**/*.ts', '!**/*.tsx'],

  'asar': true,
  'compression': 'normal',

  'electronFuses':
    {
      'runAsNode': false,
      'enableNodeOptionsEnvironmentVariable': false,
      'enableNodeCliInspectArguments': false,
      'onlyLoadAppFromAsar': true,
      'enableEmbeddedAsarIntegrityValidation': true
    },

  'removePackageScripts': true,
  'removePackageKeywords': true,

  'win':
    {
      'target': [{ 'target': 'nsis', 'arch': ['x64'] }, { 'target': 'portable', 'arch': ['x64'] }],
      'icon': 'build/icon.ico'
    },

  'linux':
    {
      'target': ['AppImage', 'deb'],
      'category': 'Utility',
      'icon': 'build/icon.png',
      'maintainer': 'hlsitechio'
    },

  'nsis':
    {
      'oneClick': false,
      'perMachine': false,
      'allowToChangeInstallationDirectory': true,
      'createDesktopShortcut': true,
      'createStartMenuShortcut': true,
      'shortcutName': 'App Shell',
      'artifactName': '${productName}-Setup-${version}.${ext}'
    },

  'portable': { 'artifactName': '${productName}-Portable-${version}.${ext}' },

  'publish': { 'provider': 'github', 'owner': 'hlsitechio', 'repo': 'electron-shell-framework' },

  'npmRebuild': false
}
