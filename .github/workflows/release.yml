name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + lint + tests
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build (electron-vite)
        run: npm run build

      - name: Generate icon
        run: npm run icon

      # electron-builder publishes to the GitHub release automatically
      # via the publish provider in electron-builder.yml (github,
      # owner hlsitechio, repo electron-shell-framework).
      - name: Package & publish (Windows)
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            release/**/*.exe
            release/**/*.yml
          if-no-files-found: ignore
